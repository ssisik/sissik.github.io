<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
       .new-tabel{
        width: 740px;
        height: 620px;
        background-image: linear-gradient(to right, #000000, #6E0C13);
        display:flex;
        margin-right: auto;
        margin-left: auto;
        border-radius: 2%;
        box-shadow: 2px 2px 4px rgba(61, 105, 16, 0.5);
        position:relative
       }
        @font-face { 
        font-family: 'AmazDooMRightOutline'; 
        src: url('fonts/AmazDooMRightOutline.ttf') format('truetype');
       }
       .text{
        position: absolute;
        font-family: AmazDooMRightOutline;
        color: #ffffff;
        font-size: 50px;
        font-weight: 900;
        padding:27px 100px 0px 480px;
        text-align: left;
        word-break:normal;
        text-shadow: -2px -2px 0 #6E0C13,
        2px 2px 5px black,
        4px 4px 8px rgba(0,0,0,0.7);
       }
       .info
       {
       position: absolute; 
       bottom: 20px; 
       right: 20px; 
       padding: 8px 16px; background-color: rgba(255, 255, 255, 0.9); 
       color: #4a5568; 
       border-radius: 6px;
       cursor: pointer;
       transition: all 0.3s ease-in-out;
       }
       .info,
       .post{
        font-family: AmazDooMRightOutline;
        color:black;
        font-weight: 900;
       }
    </style>
</head>
<body>
    <div class="new-tabel">
        <img src="C:\Users\vladp\Desktop\publicc\images\posts\Doomet.jpg" alt="">
    <div class="text">Розыгрыш
        DOOM Eternal
    </div>
<a href="сюда вставь адрес" class="info">
    <div class="post">Прочитать пост</div>
</a>
</body>
</html>
